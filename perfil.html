<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Perfil | Creative Drive</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================================
         NAVBAR
    ====================================================== -->

    <header class="navbar">

        <!-- LOGO -->

        <a
            href="index.html"
            class="logo"
        >

            <span class="logo-icon">
                ✦
            </span>

            <span>
                Creative Drive
            </span>

        </a>



        <!-- MENÚ -->

        <nav class="nav-menu">

            <a href="index.html#inicio">
                Inicio
            </a>

            <a href="index.html#directorio">
                Directorio
            </a>

            <a href="index.html#sellos">
                Sellos
            </a>

            <a href="index.html#nosotros">
                Nosotros
            </a>

        </nav>



        <!-- ACCIONES -->

        <div
            class="nav-actions"
            id="navActions"
        >

            <!--
                JavaScript genera aquí
                los botones de sesión.
            -->

        </div>

    </header>



    <!-- =====================================================
         CONTENIDO DEL PERFIL
         
         IMPORTANTE:
         El contenido se genera automáticamente mediante
         script.js según el ID recibido en la URL.
         
         Ejemplo:
         perfil.html?id=cafe-central
         perfil.html?id=arte-diseno
         perfil.html?id=dulce-momento
    ====================================================== -->

    <main class="profile-page">

        <div
            id="profileContainer"
            class="profile-container"
        >

            <!--

                JavaScript cargará aquí:

                - Portada
                - Logo
                - Nombre
                - Sello
                - Ubicación
                - Categorías
                - Descripción
                - Redes sociales
                - WhatsApp
                - Correo
                - Reseñas
                - Calificaciones
                - Formulario de reseña
                - Acciones del emprendimiento

            -->

            <div class="profile-loading">

                <div class="profile-loading-icon">
                    ✦
                </div>

                <h2>
                    Cargando perfil...
                </h2>

                <p>
                    Estamos preparando la información
                    del emprendimiento.
                </p>

            </div>

        </div>

    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer>

        <div class="footer-content">


            <!-- MARCA -->

            <div class="footer-brand">

                <a
                    href="index.html"
                    class="logo"
                >

                    <span class="logo-icon">
                        ✦
                    </span>

                    <span>
                        Creative Drive
                    </span>

                </a>

                <p>
                    Conectando personas con emprendimientos.
                </p>

            </div>



            <!-- ENLACES -->

            <div class="footer-links">

                <a href="index.html#inicio">
                    Inicio
                </a>

                <a href="index.html#directorio">
                    Directorio
                </a>

                <a href="index.html#sellos">
                    Sellos
                </a>

                <a href="index.html#nosotros">
                    Nosotros
                </a>

            </div>

        </div>



        <!-- COPYRIGHT -->

        <div class="footer-bottom">

            <p>
                © 2026 Creative Drive
            </p>

        </div>

    </footer>



    <!-- =====================================================
         SCRIPT PRINCIPAL
    ====================================================== -->

    <script src="script.js"></script>


</body>

</html>
